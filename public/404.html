<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — Peach Stack</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta name="robots" content="noindex" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f8fafc;
        color: #1e293b;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
      }
      .logo { font-size: 3rem; margin-bottom: 1rem; }
      h1 { font-size: 1.875rem; font-weight: 800; margin-bottom: 0.75rem; }
      p { color: #64748b; font-size: 1.125rem; max-width: 28rem; margin-bottom: 2rem; }
      .links { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
      a {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border-radius: 1rem;
        font-weight: 700;
        font-size: 0.95rem;
        text-decoration: none;
        transition: opacity 0.15s;
      }
      a:hover { opacity: 0.85; }
      .primary { background: #ff6347; color: #fff; }
      .secondary { background: #fff; color: #1e293b; border: 2px solid #e2e8f0; }
    </style>
    <script>
      // Single Page Apps on GitHub Pages
      // Redirect all 404s back to index.html preserving the path and query string
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <div class="logo">🍑</div>
    <h1>Page Not Found</h1>
    <p>Oops! The page you're looking for doesn't exist. Let's get you back on track.</p>
    <div class="links">
      <a href="/" class="primary">Go Home</a>
      <a href="/apply" class="secondary">Apply as Student</a>
      <a href="/for-employers" class="secondary">For Employers</a>
      <a href="/about" class="secondary">About Us</a>
      <a href="/contact" class="secondary">Contact</a>
    </div>
  </body>
</html>
